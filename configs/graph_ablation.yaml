seed: 42
seeds: [42, 123, 2026]
deterministic: true

experiment:
  name: graph_ablation
  max_gpu_runs: 6
  max_retries_per_signature: 0
  one_active_run: true
  registry_path: /content/drive/.shortcut-targets-by-id/1jMUTXWHeee5LVuRralPSP1dFOLHXith-/supply_chain_research/experiment_registry_graph_ablation.json
  require_archive_validation: true
  require_drive_authorization: true
  require_pushed_commit: true
  allow_execution: false
  max_job_seconds: 7200
  overall_max_seconds: 21600

preprocessing:
  start_date: '2015-01-01'
  end_date: '2017-08-15'
  chunksize: 500000
  missing_policy: zero
  max_seconds: 7200

data:
  processed_dir: /content/drive/.shortcut-targets-by-id/1jMUTXWHeee5LVuRralPSP1dFOLHXith-/supply_chain_research/data/processed/9c7c18061dc1fbf5
  scaler: standard
  train_ratio: 0.70
  validation_ratio: 0.15
  lookback: 14
  horizon: 7
  undirected_graph: true
  use_residual_baseline: false

training:
  batch_size: 4
  epochs: 100
  patience: 15
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  loss: huber
  huber_delta: 1.0
  scheduler_factor: 0.5
  scheduler_patience: 8

models:
  stgt:
    d_model: 64
    temporal_heads: 2
    spatial_heads: 4
    dropout: 0.30

graph_variants:
  current:
    graph_edge_types: [region_city, city_store, store_family]
    expected_csv_edge_count: 1858
    expected_undirected_message_edge_count: 3716
    expected_isolated_node_count: 0
    assumption: "Existing metadata graph; all processed edge types retained."
  geographic_only:
    graph_edge_types: [region_city, city_store]
    expected_csv_edge_count: 76
    expected_undirected_message_edge_count: 152
    expected_isolated_node_count: 33
    assumption: "Retain region-city and city-store hierarchy edges; global family nodes remain in the node table but are isolated."

outputs:
  drive_artifact_root: /content/drive/.shortcut-targets-by-id/1jMUTXWHeee5LVuRralPSP1dFOLHXith-/supply_chain_research/experiments/adaptive_stgt_campaign/graph_ablation
  checkpoint_dir: /content/drive/.shortcut-targets-by-id/1jMUTXWHeee5LVuRralPSP1dFOLHXith-/supply_chain_research/experiments/adaptive_stgt_campaign/graph_ablation/_controller/checkpoints
  metrics_dir: /content/drive/.shortcut-targets-by-id/1jMUTXWHeee5LVuRralPSP1dFOLHXith-/supply_chain_research/experiments/adaptive_stgt_campaign/graph_ablation/_controller/metrics
  predictions_dir: /content/drive/.shortcut-targets-by-id/1jMUTXWHeee5LVuRralPSP1dFOLHXith-/supply_chain_research/experiments/adaptive_stgt_campaign/graph_ablation/_controller/predictions
  logs_dir: /content/drive/.shortcut-targets-by-id/1jMUTXWHeee5LVuRralPSP1dFOLHXith-/supply_chain_research/experiments/adaptive_stgt_campaign/graph_ablation/_controller/logs
